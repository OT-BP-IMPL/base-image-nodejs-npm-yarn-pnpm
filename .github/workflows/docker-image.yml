name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo snap install yq

      - name: Get Docker image name and tag
        id: vars
        run: |
          IMAGE_NAME=$(yq eval '.image.name' docker-config.yml)
          IMAGE_TAG=$(yq eval '.image.tag' docker-config.yml)
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Image Tag: $IMAGE_TAG"  # Debugging statement to check IMAGE_TAG value

      - name: Print Image Tag
        run: |
          echo "IMAGE_TAG from environment: ${{ env.IMAGE_TAG }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: |
          docker build -t $IMAGE_NAME .

      - name: Tag and Push the Docker image
        run: |
          echo "Using IMAGE_TAG: ${{ env.IMAGE_TAG }}"  # Debugging statement
          docker tag $IMAGE_NAME $IMAGE_NAME:${{ env.IMAGE_TAG }}
          docker push $IMAGE_NAME:${{ env.IMAGE_TAG }}

      - name: Configure Git for Tagging
        run: |
          echo "Configuring Git for tagging with tag: ${{ env.IMAGE_TAG }}"  # Debugging statement
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.IMAGE_TAG }}" -m "Release v${{ env.IMAGE_TAG }}"
          git push "https://${{ github.actor }}:${{ secrets.REPO_TOKEN }}@github.com/${{ github.repository }}.git" "${{ env.IMAGE_TAG }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ env.IMAGE_TAG }}"
          name: "Release v${{ env.IMAGE_TAG }}"
          files: |
            CHANGELOG.md
            RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}